name: VoidLink CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make unit-test

      - name: Build binary
        run: make build

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidlink
          path: ./vlink
          retention-days: 5  